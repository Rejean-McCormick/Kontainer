[build-system]
requires = ["setuptools>=78,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "kristal-container"
version = "1.0.0rc1"
description = "Uncompressed Kristal containers with authenticated encryption and explicit trust boundaries"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{name = "Kristal contributors"}]
dependencies = ["PyNaCl>=1.6.2,<2", "argon2-cffi>=25.1.0,<26"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Topic :: Security :: Cryptography"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.12,<1", "build>=1,<2", "jsonschema>=4,<5"]

[project.scripts]
kristal-container = "kristal_container.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["kristal_container.crypto.Protection", "kristal_container.crypto.Credentials", "kristal_container.common.Limits"]
